<elder-single-pane-wrapper>
  <div class="debug-page">
    <h1>Game flow</h1>

    <section class="game-flow-panel">
      @if (gameFlow(); as gameFlowState) {
        <p class="game-flow-readout">
          Tick {{ gameFlowState.tick }} · {{ gameFlowState.mode }}
          @if (gameFlowState.paused) {
            · paused
          }
        </p>
      } @else {
        <p class="status-text">Loading game flow…</p>
      }
      <div class="debug-actions">
        <button mat-flat-button color="primary" type="button" [disabled]="busy()" (click)="pause()">
          Pause
        </button>
        <button mat-flat-button color="primary" type="button" [disabled]="busy()" (click)="resume()">
          Resume
        </button>
        <button mat-stroked-button type="button" [disabled]="busy()" (click)="setMode('LIVE')">
          Live
        </button>
        <button mat-stroked-button type="button" [disabled]="busy()" (click)="setMode('BATCH')">
          Batch
        </button>
      </div>
      <div class="debug-actions advance-row">
        <label class="ticks-label">
          Batch size
          <input
            type="number"
            min="1"
            max="100000"
            [value]="batchSize()"
            (input)="onBatchSizeInput($event)"
          />
        </label>
        <label class="ticks-label">
          Batches
          <input
            type="number"
            min="1"
            max="100000"
            [value]="batchCount()"
            (input)="onBatchCountInput($event)"
          />
        </label>
        <button mat-flat-button color="primary" type="button" [disabled]="busy()" (click)="advance()">
          Advance
        </button>
      </div>
    </section>

    @if (status(); as message) {
      <p class="status-text">{{ message }}</p>
    }
  </div>
</elder-single-pane-wrapper>
