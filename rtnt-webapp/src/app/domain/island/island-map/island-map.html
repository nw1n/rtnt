<elder-single-pane-wrapper>
  <div class="island-map-view">
    @if (gameFlow(); as gameFlowState) {
      <p class="game-flow-readout">
        Tick {{ gameFlowState.tick }} · {{ gameFlowState.mode }}
        @if (gameFlowState.paused) {
          · paused
        }
      </p>
    }
    @if (islands().length === 0) {
      <p class="state-text">No islands available.</p>
    } @else {
      <div class="map-wrapper">
        <svg
          class="island-map"
          [attr.viewBox]="mapBoundsString()"
          preserveAspectRatio="xMidYMid meet"
        >
          @for (island of islands(); track island.id) {
            <g class="island-group">
              <rect
                [attr.x]="island.x"
                [attr.y]="island.y"
                [attr.width]="island.width"
                [attr.height]="island.length"
                class="island-shape"
                rx="8"
                ry="8"
              />
              <text
                [attr.x]="island.x + island.width / 2"
                [attr.y]="island.y + island.length / 2"
                text-anchor="middle"
                dominant-baseline="middle"
                class="island-label"
              >
                {{ island.name }}
              </text>
            </g>
          }
          @for (ship of shipMarkers(); track ship.id) {
            <g
              class="ship-marker"
              [class.underway]="ship.underway"
              [class.player-owned]="ship.playerOwned"
              [attr.transform]="'translate(' + ship.x + ' ' + ship.y + ') rotate(' + ship.headingDeg + ')'"
            >
              <title>{{ ship.name }}{{ ship.underway ? ' (underway)' : '' }}</title>
              @if (ship.underway) {
                <polygon points="16,0 -10,-9 -10,9" class="ship-shape" />
              } @else {
                <circle r="10" class="ship-shape" />
              }
            </g>
          }
        </svg>
      </div>
    }
  </div>
</elder-single-pane-wrapper>
