<elder-single-pane-wrapper>
  <div class="island-table-view">
    <div class="table-header">
      <h1>Islands</h1>
      <button mat-flat-button color="primary" type="button" [disabled]="busy()" (click)="refresh()">
        Refresh
      </button>
    </div>
    @if (error(); as message) {
      <p class="state-text">{{ message }}</p>
    }
    @if (islands().length === 0 && !busy() && !error()) {
      <p class="state-text">No islands available.</p>
    } @else if (islands().length > 0) {
      <table mat-table [dataSource]="islands()" class="island-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let island">{{ island.name }}</td>
        </ng-container>
        <ng-container matColumnDef="population">
          <th mat-header-cell *matHeaderCellDef>Population</th>
          <td mat-cell *matCellDef="let island">{{ island.population }}</td>
        </ng-container>
        <ng-container matColumnDef="x">
          <th mat-header-cell *matHeaderCellDef>X</th>
          <td mat-cell *matCellDef="let island">{{ island.x }}</td>
        </ng-container>
        <ng-container matColumnDef="y">
          <th mat-header-cell *matHeaderCellDef>Y</th>
          <td mat-cell *matCellDef="let island">{{ island.y }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    }
  </div>
</elder-single-pane-wrapper>
