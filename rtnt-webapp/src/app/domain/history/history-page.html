<elder-single-pane-wrapper>
  <div class="history-view">
    <div class="history-header">
      <h1>History</h1>
      <button mat-flat-button color="primary" type="button" [disabled]="busy()" (click)="refresh()">
        Refresh
      </button>
    </div>
    @if (error(); as message) {
      <p class="state-text">{{ message }}</p>
    }
    @if (snapshots().length === 0 && !busy() && !error()) {
      <p class="state-text">No snapshots available yet.</p>
    } @else if (snapshots().length > 0) {
      <p class="state-text">{{ snapshots().length }} snapshots</p>
      <div class="chart-host" [appEcharts]="chartOption()" [dark]="darkTheme()"></div>
    }
  </div>
</elder-single-pane-wrapper>
