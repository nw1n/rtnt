plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${bootDependencyManagement}"
    id 'eclipse'
    id 'idea'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation("org.springframework.boot:spring-boot-starter-data-mongodb")

    // Test dependencies
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

bootJar {
    archiveClassifier = 'exec'
}

bootRun {
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

tasks.register('benchmark', Test) {
    group = 'verification'
    description = 'Time GameLoop.advance against a wiped rtnt-test Mongo database'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'rtnt.benchmark', 'true'
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'standardOut', 'standardError'
    }
}

tasks.register('recreateIslands', JavaExec) {
    group = 'application'
    description = 'Delete all islands and seed a new set'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.rtnt.RtntApplication'
    args = ['--spring.main.web-application-type=none', 'recreate-islands']
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

